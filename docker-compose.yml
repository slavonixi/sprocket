services:
  # 1. Database PostgreSQL per la persistenza dei dati (Clienti, Macchinari, Report)
  postgres_db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 54320:5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: always

  # 2. Redis: Funge da Broker per Celery
  redis:
    image: redis:7-alpine
    restart: always

  # 3. Web: Il backend Django con DRF
  core:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/sprocket
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres_db  # Deve corrispondere al nome del servizio sopra
      - DB_PORT=5432
    depends_on:
      - postgres_db
      - redis

  # 4. Celery Worker: Gestisce i task in background (es. calcolo costi Report)
  worker:
    build: .
    # Utilizziamo il modulo celeryTutorial come concordato nella nostra conversazione
    command: celery -A core worker -l info
    volumes:
      - ./:/sprocket
    environment:
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres_db
      - DB_PORT=5432
    restart: always
    depends_on:
      - core
      - redis

volumes:
  postgres_data: